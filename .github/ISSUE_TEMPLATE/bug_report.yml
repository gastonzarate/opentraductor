name: Bug report
description: Something does not work, or works worse than the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do **not** use this form: see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected and what you got. Quote any error text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran, in order.
      render: shell
    validations:
      required: true
  - type: input
    id: mac
    attributes:
      label: Mac model, chip and RAM
      placeholder: MacBook Pro, M2 Pro, 32 GB
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: macOS 15.1
    validations:
      required: true
  - type: dropdown
    id: profile
    attributes:
      label: Profile
      options:
        - Default (Parakeet + Marian + Kokoro)
        - Fast (Moonshine + Qwen3)
        - Other / not sure
    validations:
      required: true
  - type: dropdown
    id: blackhole
    attributes:
      label: Using BlackHole 2ch?
      options: ["Yes", "No"]
    validations:
      required: true
  - type: input
    id: commit
    attributes:
      label: Commit
      description: Output of `git rev-parse --short HEAD`
  - type: textarea
    id: logs
    attributes:
      label: Log output
      description: The terminal output of `python -m runtime run`, trimmed to the relevant part. Remove anything private.
      render: shell
