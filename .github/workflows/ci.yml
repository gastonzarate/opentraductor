name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  tests:
    name: pytest (macOS 15, Apple Silicon)
    runs-on: macos-15
    timeout-minutes: 40
    # macos-14 images were retired by GitHub on 2026-11-02. macos-15 is also Apple Silicon (arm64).
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install dependencies
        run: uv sync --extra runtime

      # The runner has no model weights and no audio. Tests that need them skip themselves
      # (see "Run the tests" in README.md).
      - name: Run tests
        run: uv run --extra runtime python -m pytest tests -q
