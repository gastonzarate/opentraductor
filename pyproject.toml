[project]
name = "opentraductor"
version = "0.1.0"
description = "Local Argentine Spanish to US English speech translation, benchmark first."
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy>=2,<3",
  "soundfile>=0.13,<1",
  "sacrebleu>=2.5,<3",
  "jiwer>=4,<5",
]

[project.optional-dependencies]
runtime = [
    "ctranslate2==4.9.0",
    "en-core-web-sm",
    "huggingface-hub==2.4.0",
    "misaki[en]==0.9.4",
    "mlx==0.32.4",
    "mlx-audio==0.6.5",
    "parakeet-mlx==0.7.0",
    "sentencepiece==0.2.3",
    "silero-vad==6.2.0",
    "sounddevice==0.5.6",
    "torch==2.15.0",
    "transformers==5.23.0",
]

moonshine = [
    "moonshine-voice==0.1.6",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.24,<2"]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
